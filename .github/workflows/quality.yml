name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Backend tests
        run: pnpm test:backend

      - name: Export preview web
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_SUPABASE_KEY: preview-anon-key
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_UI_PREVIEW: "1"
        run: pnpm exec expo export --platform web --output-dir dist-preview

      - name: Export normal web
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_SUPABASE_KEY: ci-public-anon-key
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_UI_PREVIEW: "0"
        run: pnpm exec expo export --platform web --output-dir dist-production
